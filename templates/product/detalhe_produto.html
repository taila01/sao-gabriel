<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ produto.name }} — São Gabriel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-[#4E342E]">
  {% include 'nav.html' %}
  <main class="max-w-4xl mx-auto px-6 py-16">
    <a href="{% url 'product:listar_produtos' %}" class="underline">← Voltar aos cafés</a>
    <article class="bg-white border rounded-xl p-8 mt-6">
      <h1 class="text-3xl font-semibold mb-5">{{ produto.name }}</h1>
      <p class="mb-6">{{ produto.description }}</p>
      <p class="text-2xl font-bold mb-8">R$ {{ produto.price|floatformat:2 }}</p>
      <a href="{% url 'store:adicionar_ao_carrinho' produto.id_product %}" class="inline-block bg-[#4E342E] text-white px-6 py-3 rounded">Adicionar ao carrinho</a>
    </article>
  </main>
  {% include 'footer.html' %}
</body>
</html>
