{% extends 'administrator/base.html' %}{% load l10n %}{% block admin_content %}<div class="sg-profile"><div class="sg-page-head"><p class="sg-eyebrow">CATÁLOGO</p><h1>{{ titulo_gerenciamento }}</h1></div><div class="sg-panel"><form class="sg-form" method="post" enctype="multipart/form-data">{% csrf_token %}<div class="sg-field"><label for="id_name">Nome do produto</label><input id="id_name" name="name" value="{{ product.name|default:'' }}" required></div><div class="sg-fields"><div class="sg-field"><label for="id_category">Categoria</label><select id="id_category" name="category" required><option value="">Selecione</option><option value="1" {% if product.fk_category_id == 1 %}selected{% endif %}>Cafés especiais</option><option value="2" {% if product.fk_category_id == 2 %}selected{% endif %}>Kits especiais</option><option value="3" {% if product.fk_category_id == 3 %}selected{% endif %}>Clube</option></select></div><div class="sg-field"><label for="id_price">Preço (R$)</label><input id="id_price" name="price" type="number" step="0.01" min="0" value="{{ product.price|unlocalize }}" required></div></div><div class="sg-field"><label for="id_description">Descrição</label><textarea id="id_description" name="description" rows="5" required>{{ product.description|default:'' }}</textarea></div><div class="sg-field"><label for="id_image">Imagens</label><input type="file" id="id_image" name="images" multiple accept="image/*"></div><div class="sg-actions"><button class="sg-btn" type="submit">Salvar produto ↗</button><a class="sg-textlink" href="{% url 'product_list' %}">Cancelar e voltar</a></div></form></div></div>{% endblock %}
